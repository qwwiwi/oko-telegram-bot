{
  "name": "oko-telegram-bot",

  "services": {
    "db": {
      "image": "postgres@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8",
      "user": "999:999",
      "environment": {"POSTGRES_DB": "archive", "POSTGRES_USER": "archive", "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:-}"},
      "command": ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-64MB}", "-c", "work_mem=${PG_WORK_MEM:-4MB}", "-c", "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-32MB}", "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-192MB}", "-c", "max_connections=${PG_MAX_CONNECTIONS:-20}", "-c", "max_parallel_workers_per_gather=0", "-c", "autovacuum_max_workers=2"],
      "volumes": ["${OKO_DATA_DIR:?Set OKO_DATA_DIR in .env}/db:/var/lib/postgresql/data"],
      "shm_size": "128m",
      "mem_limit": "${DB_MEM_LIMIT:-384m}",
      "pids_limit": 128,
      "restart": "unless-stopped",
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "healthcheck": {"test": ["CMD-SHELL", "pg_isready -U archive -d archive"], "interval": "5s", "timeout": "3s", "retries": 12}
    },
    "api": {
      "build": {"context": "."},
      "image": "${ARCHIVE_IMAGE:-oko-telegram-bot:local}",
      "user": "10001:10001",
      "env_file": ["${ARCHIVE_ENV_FILE:-.env}"],
      "read_only": true,
      "tmpfs": ["/run/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"],
      "environment": {"TMPDIR": "/run/tmp"},
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 128,
      "restart": "unless-stopped",
      "command": ["api", "--host", "0.0.0.0", "--port", "8610"],
      "ports": ["127.0.0.1:8610:8610"],
      "volumes": ["${ARCHIVE_CONFIG_FILE:-./settings.toml}:/run/archive/settings.toml:ro", "${OKO_DATA_DIR:?Set OKO_DATA_DIR in .env}/media:/var/lib/archive-media:ro"],
      "depends_on": {"db": {"condition": "service_healthy"}},
      "mem_limit": "512m"
    },
    "poller": {
      "build": {"context": "."},
      "image": "${ARCHIVE_IMAGE:-oko-telegram-bot:local}",
      "user": "10001:10001",
      "env_file": ["${ARCHIVE_ENV_FILE:-.env}"],
      "read_only": true,
      "tmpfs": ["/run/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"],
      "environment": {"TMPDIR": "/run/tmp"},
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 128,
      "restart": "unless-stopped",
      "command": ["poller"],
      "volumes": ["${ARCHIVE_CONFIG_FILE:-./settings.toml}:/run/archive/settings.toml:ro"],
      "depends_on": {"db": {"condition": "service_healthy"}},
      "mem_limit": "256m"
    },
    "worker": {
      "build": {"context": "."},
      "image": "${ARCHIVE_IMAGE:-oko-telegram-bot:local}",
      "user": "10001:10001",
      "env_file": ["${ARCHIVE_ENV_FILE:-.env}"],
      "read_only": true,
      "tmpfs": ["/run/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"],
      "environment": {"TMPDIR": "/run/tmp"},
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 128,
      "restart": "unless-stopped",
      "command": ["worker"],
      "volumes": ["${ARCHIVE_CONFIG_FILE:-./settings.toml}:/run/archive/settings.toml:ro", "${OKO_DATA_DIR:?Set OKO_DATA_DIR in .env}/media:/var/lib/archive-media"],
      "depends_on": {"db": {"condition": "service_healthy"}},
      "mem_limit": "1g"
    },
    "ops": {
      "build": {"context": "."},
      "image": "${ARCHIVE_IMAGE:-oko-telegram-bot:local}",
      "user": "10001:10001",
      "env_file": ["${ARCHIVE_ENV_FILE:-.env}"],
      "read_only": true,
      "tmpfs": ["/run/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"],
      "environment": {"TMPDIR": "/run/tmp"},
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "pids_limit": 128,
      "profiles": ["tools"],
      "command": ["migrate"],
      "restart": "no",
      "volumes": ["${ARCHIVE_CONFIG_FILE:-./settings.toml}:/run/archive/settings.toml:ro", "${OKO_DATA_DIR:?Set OKO_DATA_DIR in .env}/media:/var/lib/archive-media:ro", "${OKO_DATA_DIR:?Set OKO_DATA_DIR in .env}/exports:/var/lib/archive-exports"],
      "depends_on": {"db": {"condition": "service_healthy"}},
      "mem_limit": "512m"
    }
  }
}
